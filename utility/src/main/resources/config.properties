# ============================================================
# Configurazione SAP S/4HANA Cloud - API Sales Order
# ============================================================
# ATTENZIONE: questo file NON deve essere committato su Git.
#             Aggiungere "config.properties" al .gitignore
#
# Il file può anche stare FUORI dal WAR: avviare la JVM con
#     -Dlamplast.utility.config=/percorso/config.properties
# (oppure variabile d'ambiente LAMPLAST_UTILITY_CONFIG).
# In quel caso le modifiche si vedono riaprendo la pagina,
# senza rifare il deploy.
# ============================================================

# ------------------------------------------------------------
#  SISTEMI SAP
#
#  sap.systems        = elenco ID (separati da virgola), nell'ordine
#                       in cui compaiono nella combo di selezione
#  sap.system.default = ID selezionato all'apertura della pagina
#
#  Per ogni ID:
#    sap.system.<ID>.name        testo visualizzato (combo + barra)
#    sap.system.<ID>.productive  true = Produzione, false = Test.
#                                Se assente vale false (barra ROSSA).
#    sap.system.<ID>.baseUrl     URL base senza "/" finale  (obbligatorio)
#    sap.system.<ID>.username    utente tecnico              (obbligatorio)
#    sap.system.<ID>.password    password                    (obbligatorio)
#    sap.system.<ID>.client      facoltativo, default = sap.client
#
#  Qualsiasi altra property di questo file può essere ridefinita
#  per un singolo sistema, es.:
#    sap.system.PRD.odv.virtual.prefix = 113
#    sap.system.DEV.excel.sheetName    = Foglio1
# ------------------------------------------------------------
sap.systems        = DEV, PRD
sap.system.default = DEV

# -->  Sistema di sviluppo
sap.system.DEV.name       = LAMPLAST Sviluppo
sap.system.DEV.productive = false
sap.system.DEV.baseUrl    = https://my434383.s4hana.cloud.sap
sap.system.DEV.username   = COMM_USER_F46100
sap.system.DEV.password   = Eone_Group_Febbraio2026

# -->  Sistema di Produzione
sap.system.PRD.name       = LAMPLAST Produzione
sap.system.PRD.productive = true
sap.system.PRD.baseUrl    = https://my438840.s4hana.cloud.sap
sap.system.PRD.username   = JAVA_APP_USER
sap.system.PRD.password   = JavaAppUser_23051995

# -->  Sistema di test (era commentato in config.properties.LAMPLAST_PRD).
#      Per attivarlo: completare le credenziali e aggiungere TST a sap.systems
#sap.system.TST.name       = LAMPLAST Test
#sap.system.TST.productive = false
#sap.system.TST.baseUrl    = https://my434879.s4hana.cloud.sap
#sap.system.TST.username   =
#sap.system.TST.password   =

# Client SAP (default per tutti i sistemi)
sap.client=100

# ------------------------------------------------------------
#  URL app Fiori per visualizzazione ordini
# ------------------------------------------------------------
sap.url.va03  = /sap/bc/ui2/flp#SalesOrder-manage?SalesOrder=
sap.url.fiori = /sap/bc/ui2/flp#SalesOrder-displayFactSheet?SalesOrder=

# ------------------------------------------------------------
#  Excel — foglio
#
#  Nome del foglio da leggere nel file Excel.
#  Se il foglio non esiste, viene usato il primo foglio disponibile
#  e la statusbar mostra un avviso.
# ------------------------------------------------------------
excel.sheetName = Export

# ------------------------------------------------------------
#  Normalizzazione numero OdV ricevuto
# Se questi parametri mancano, allora il numero ricevuto è quello dell'OdV in SAP
odv.virtual.prefix=113
odv.virtual.offset=1130000000
# ------------------------------------------------------------

# ------------------------------------------------------------
#  Excel — nomi colonne
#
#  Modificare solo se le intestazioni del file ricevuto
#  differiscono dai default qui indicati.
# ------------------------------------------------------------
excel.col.ordine        = Ordine
excel.col.posizione     = Pos.
excel.col.schedulazione = Sch.
excel.col.materiale     = Materiale
excel.col.materialeText = Descrizione
excel.col.quantita      = Qtà
excel.col.dataProd      = Data prod.
