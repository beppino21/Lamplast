# =============================================================================
# S/4HANA Chart of Accounts Extractor - Configurazione
# =============================================================================

# --- Connessione S/4HANA ---
# URL base del tenant (senza slash finale)
# Nota: per S/4HANA Cloud Public Edition con servizi custom usare il formato:
#   https://myXXXXXX-api.s4hana.cloud.sap
# -->  Sistema di test
#s4.base.url=https://my434879.s4hana.cloud.sap

# -->  Sistema di Produzione
s4.base.url=https://my438840.s4hana.cloud.sap

# Credenziali Basic Auth
#s4.username=BTP_USER_CONNECTION
#s4.password=your_password
s4.username=JAVA_APP_USER
s4.password=JavaAppUser_23051995


# --- Parametri estrazione ---
# Codice società (BUKRS)
s4.company.code=S001

# Codice piano dei conti (es: YCOA, INT, KONS...)
# Lasciare vuoto: viene ignorato perché il filtro avviene per società
# s4.chart.of.accounts=YCOA

# Lingua di estrazione (codice SAP a 2 char: IT, EN, DE, FR, ES...)
s4.language=IT

# Numero massimo di record per pagina OData ($top)
# Valore consigliato: 500 - 1000
s4.page.size=500

# Timeout connessione HTTP (secondi)
s4.http.timeout.connect=30

# Timeout lettura risposta HTTP (secondi)
s4.http.timeout.read=120

# --- Output CSV ---
# Directory di destinazione del file CSV
# Usare percorso assoluto per la schedulazione (cron/Task Scheduler)
# Esempi Windows: C:/temp/coa-export   oppure   C:\\temp\\coa-export
# Esempi Linux:   /var/data/coa-export
output.directory=C:/temp/coa-export

# Nome del file CSV (supporta pattern data con java.time.format.DateTimeFormatter)
# Esempi:
#   coa_export.csv               -> nome fisso (sovrascrive ogni volta)
#   coa_export_yyyyMMdd.csv      -> aggiunge la data (es: coa_export_20260218.csv)
#   coa_export_yyyyMMdd_HHmm.csv -> aggiunge data e ora
output.filename=coa_export_yyyyMMdd_HHmmss.csv

# Separatore CSV (virgola o punto e virgola)
output.separator=;

# Charset del file di output
output.charset=UTF-8

# Includere l'intestazione (header row) nel CSV: true/false
output.include.header=true

# --- Logging ---
# Directory per i file di log (lasciare vuoto per log solo su console)
# Esempi Windows: C:/logs/coa-extractor
# Esempi Linux:   /var/log/coa-extractor
log.directory=C:/logs/coa-extractor
