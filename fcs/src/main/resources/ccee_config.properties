# =============================================================================
# Queste due proprietà indicano dove si trovano il JAR del bridge e il suo
# file di configurazione sul filesystem del server.
# Su Linux: usare slash (/)
# Su Windows: usare backslash (\\) oppure slash (/)
#
# Esempio Linux:
#   bridge.jar.path=/opt/fcs/fcs-wms-bridge-1.0.0.jar
#   bridge.config.path=/opt/fcs/config.properties
#
# Esempio Windows:
#   bridge.jar.path=C:/fcs/fcs-wms-bridge-1.0.0.jar
#   bridge.config.path=C:/fcs/config.properties

